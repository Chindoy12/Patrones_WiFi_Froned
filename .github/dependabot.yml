# Dependabot opens a Pull Request when a dependency has a new version (for example a security fix): npm packages and
# the GitHub Actions of the workflow. Once a month and at most 3 at a time; React and Vite updates come grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite-vitest:
        patterns: ["vite", "vitest", "@vitejs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
